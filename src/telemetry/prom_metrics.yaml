# This documents custom metrics that are implemented in the app
---
version: 1.0

service: Monitor

hibp:
  hibp_notify_requests_total:
    description: |
      Metric to instrument the number of requests from HIBP notifying of breaches
    type: counter
    scope: |
      The "/hibp/notify" endpoint
    # No alerting
    alert_policy: []

  hibp_notify_request_failures_total:
    description: |
      Metric to instrument the number of failed requests on HIBP notify endpoint
    type: counter
    labels:
      - name: error
        description: |
          Record the error. Any of "server-error", "pubsub-error", "bad-request",
          "rate-limited", "unauthorized", "invalid-config"
    scope: |
      The "/hibp/notify" endpoint
    alert_policy:
      - severity_level: S1
        trigger_condition: |
          Trigger when the aggregate failure rate is greater than
          20 req/sec.

  hibp_range_search_total:
    description: |
      Metric to instrument strict HIBP range searches (searchHibpRange)
    type: counter
    labels:
      - name: outcome
        description: |
          Any of "match", "no-match", "not-found" (404), "http-error",
          "timeout", "network-error", "invalid-body"
      - name: status_code
        description: |
          HTTP status HIBP sent. Set on "http-error" and "invalid-body"
    scope: |
      The Firefox API, via searchHibpRange
    # Panel and alerting: MNTOR-5348
    alert_policy:
      - severity_level: S2
        trigger_condition: |
          Any "invalid-body" for 10 minutes. HIBP, or something in
          front of it, changed what it sends.
      - severity_level: S2
        trigger_condition: |
          "http-error", "timeout" and "network-error" together exceed
          5% of searches for 15 minutes.

firefox_api:
  firefox_api_auth_total:
    description: |
      Metric to instrument FxA token auth attempts on the Firefox API
    type: counter
    labels:
      - name: outcome
        description: |
          Any of "success", "missing-header", "inactive", "missing-scope",
          "no-subscriber", "introspection-error", "lookup-error"
      - name: endpoint
        description: |
          Firefox API path from openapi.yml, e.g. "/user/breaches"
      - name: client_id
        description: |
          FxA OAuth client id. Set only when the token is active.
    scope: |
      The "/api/firefox/v1" endpoints, via withFxaUser
    # Panel and alerting: MNTOR-5348
    alert_policy: []
  firefox_api_rate_limit_total:
    description: |
      Metric to instrument Firefox API rate limiting
    type: counter
    labels:
      - name: outcome
        description: |
          "allowed", "limited" (answered 429), or "redis-error"
          (let through). Not counted while the limit is 0
      - name: endpoint
        description: |
          Firefox API path from openapi.yml, e.g. "/user/breaches"
      - name: client_id
        description: |
          FxA OAuth client id
    scope: |
      The "/api/firefox/v1" endpoints, via withFxaUser
    # Panel and alerting: MNTOR-5348
    alert_policy: []
