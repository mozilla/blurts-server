# This documents custom metrics that are implemented in the app
---
version: 1.0

service: Monitor

hibp:
  hibp_notify_requests_total:
    description: |
      Metric to instrument the number of requests from HIBP notifying of breaches
    type: counter
    scope: |
      The "/hibp/notify" endpoint
    # No alerting
    alert_policy: []

  hibp_notify_request_failures_total:
    description: |
      Metric to instrument the number of failed requests on HIBP notify endpoint
    type: counter
    labels:
      - name: error
        description: |
          Record the error. Any of "server-error", "pubsub-error", "bad-request",
          "rate-limited", "unauthorized", "invalid-config"
    scope: |
      The "/hibp/notify" endpoint
    alert_policy:
      - severity_level: S1
        trigger_condition: |
          Trigger when the aggregate failure rate is greater than
          20 req/sec.

  hibp_range_search_total:
    description: |
      Metric to instrument strict HIBP range searches (searchHibpRange)
    type: counter
    labels:
      - name: outcome
        description: |
          Any of "match", "no-match", "not-found" (404), "http-error",
          "timeout", "network-error", "invalid-body"
      - name: status_code
        description: |
          HTTP status HIBP sent. Set on "http-error" and "invalid-body"
    scope: |
      The Firefox API, via searchHibpRange
    alert_policy:
      - severity_level: S2
        trigger_condition: |
          Any "invalid-body" for 10 minutes. HIBP, or something in
          front of it, changed what it sends.
      - severity_level: S2
        trigger_condition: |
          "http-error", "timeout" and "network-error" together exceed
          5% of searches for 15 minutes.

firefox_api:
  firefox_api_auth_total:
    description: |
      Metric to instrument FxA token auth attempts on the Firefox API
    type: counter
    labels:
      - name: outcome
        description: |
          Any of "success", "missing-header", "inactive", "missing-scope",
          "no-subscriber", "flag-off", "introspection-error", "lookup-error"
      - name: endpoint
        description: |
          Firefox API path from openapi.yml, e.g. "/user/breaches"
      - name: client_id
        description: |
          FxA OAuth client id. Set only when the token is active.
    scope: |
      The "/api/firefox/v1" endpoints, via withFxaUser
    alert_policy:
      - severity_level: S2
        trigger_condition: |
          "introspection-error" and "lookup-error" together exceed 5% of
          auth attempts for 15 minutes, with at least 50 attempts.
      - severity_level: S2
        trigger_condition: |
          "inactive", "missing-scope" and "missing-header" together exceed
          20% of auth attempts for 30 minutes, with at least 50 attempts.
          FxA or Firefox likely changed how tokens are issued or sent.
  firefox_api_rate_limit_total:
    description: |
      Metric to instrument Firefox API rate limiting
    type: counter
    labels:
      - name: outcome
        description: |
          "allowed", "limited" (answered 429), or "redis-error"
          (let through). Not counted while the limit is 0
      - name: endpoint
        description: |
          Firefox API path from openapi.yml, e.g. "/user/breaches"
      - name: client_id
        description: |
          FxA OAuth client id
    scope: |
      The "/api/firefox/v1" endpoints, via withFxaUser
    alert_policy:
      - severity_level: S3
        trigger_condition: |
          Any "redis-error" for 10 minutes. The limiter is failing open.
      - severity_level: S3
        trigger_condition: |
          "limited" exceeds 5% of checks for 30 minutes, with at least
          50 checks.
  firefox_api_handler_response_total:
    description: |
      Metric to instrument Firefox API route handler responses. Counts
      only requests that passed auth, the rate limit and the flag, as those
      have their own counters.
    type: counter
    labels:
      - name: endpoint
        description: |
          Firefox API path from openapi.yml, e.g. "/user/breaches"
      - name: status_code
        description: |
          HTTP status sent, e.g. 200, 400, 500, or 503 (upstream down)
      - name: client_id
        description: |
          FxA OAuth client id, when FxA returned one
    scope: |
      The "/api/firefox/v1" endpoints, via withFxaUser
    alert_policy:
      - severity_level: S2
        trigger_condition: |
          5xx responses exceed 5% of responses for 15 minutes, with at
          least 50 responses.
  firefox_api_request_duration_seconds:
    description: |
      Metric to instrument Firefox API request duration, auth and
      rate limit included, so 401 and 429 answers are timed too
    type: histogram
    labels:
      - name: endpoint
        description: |
          Firefox API path from openapi.yml, e.g. "/user/breaches"
      - name: status_code
        description: |
          HTTP status sent, e.g. 200, 401, 429, 500, or 503
    scope: |
      The "/api/firefox/v1" endpoints, via withFxaUser
    alert_policy:
      - severity_level: S3
        trigger_condition: |
          p95 exceeds 2.5s for 15 minutes, with at least 50 requests.
  firefox_api_unknown_param_total:
    description: |
      Metric to instrument Firefox API requests carrying query params or
      body keys the endpoint ignores. A rise means a client sends
      something new. Names are logged as "firefox_api_unknown_params",
      not labelled, to bound cardinality.
    type: counter
    labels:
      - name: endpoint
        description: |
          Firefox API path from openapi.yml, e.g. "/user/breaches"
      - name: client_id
        description: |
          FxA OAuth client id, when FxA returned one
    scope: |
      The "/api/firefox/v1" endpoints
    # No alerting
    alert_policy: []
  firefox_api_resolution_total:
    description: |
      Metric to instrument breaches Firefox marks resolved. Counted once
      per breach and served data class, after the write succeeds, and
      once per skipped breach name. A rise in "skipped" means Firefox
      holds breach names we no longer serve, e.g. after a HIBP rename.
    type: counter
    labels:
      - name: outcome
        description: |
          "resolved" (newly, for an affected email), "already-resolved",
          or "skipped" (matched no breach affecting the user)
      - name: data_class
        description: |
          "passwords" or "email-addresses". Not set when "skipped"
    scope: |
      The "/api/firefox/v1/user/breaches/resolutions" endpoint
    alert_policy:
      - severity_level: S3
        trigger_condition: |
          "skipped" exceeds 20% of resolutions for 1 hour, with at least
          50 resolutions.
